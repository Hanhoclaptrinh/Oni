name: frontend
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3

  # Date Time Formater
  intl: ^0.20.2

  # APIs & Socket.IO
  dio: ^5.9.0
  socket_io_client: ^3.1.3

  # Local Storage
  flutter_secure_storage: ^9.2.4

  # State Management
  flutter_riverpod: ^3.0.3

  # Dotenv
  flutter_dotenv: ^6.0.0

  # Picker
  emoji_picker_flutter: ^4.4.0
  image_picker: ^1.2.1
  file_picker: ^10.3.8

  # Progress
  percent_indicator: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  logger: ^2.6.2
  jwt_decoder: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
